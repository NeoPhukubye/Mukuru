<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukuru Money Coach</title>

    <link rel="stylesheet" href="css/onboarding.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .entry-actions {
            text-align: center;
        }

        .entry-actions button {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            color: #555555;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-link:hover,
        .back-link:focus {
            color: #16833b;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!--
        Entry point for the Reports and polish app.

        The Dashboard's "View My Reports" button currently jumps straight to
        pages/onboarding.html, so this routing page is not reached by the UI.
        It is kept as a reachable entry point and now carries a back link.
    -->

    <main class="onboarding-container">

        <a class="back-link" href="../Dashboard/index.html">&larr; Back to Dashboard</a>

        <section class="welcome-section entry-actions">

            <h1>Mukuru Money Coach</h1>

            <p>Your money, your goals, your progress.</p>

            <button id="startButton" type="button">
                Get Started
            </button>

            <button id="skipButton" type="button">
                Go to My Account
            </button>

        </section>

    </main>

    <script>
        document.getElementById("startButton").addEventListener("click", function () {
            window.location.href = "pages/onboarding.html";
        });

        document.getElementById("skipButton").addEventListener("click", function () {
            window.location.href = "pages/account.html";
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukuru Money Coach - My Account</title>

    <link rel="stylesheet" href="../css/account.css">
</head>

<body>

    <main class="account-container">

        <header class="account-header">
            <h1>My Account</h1>

            <p>Welcome back to your Money Coach.</p>
        </header>

        <section class="account-card">

            <h2>Financial Health</h2>

            <p>Your current credit score</p>

            <div class="credit-score">
                682
            </div>

            <p class="score-change">
                +24 points this month
            </p>

        </section>

        <section class="account-card">

            <h2>My Goal</h2>

            <p>School fees</p>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <p>R4,000 saved of R5,000</p>

        </section>

        <section class="account-card">

            <h2>Money Overview</h2>

            <div class="money-row">
                <span>Monthly income</span>
                <strong>R8,500</strong>
            </div>

            <div class="money-row">
                <span>Monthly expenses</span>
                <strong>R5,200</strong>
            </div>

            <div class="money-row">
                <span>Money saved</span>
                <strong>R3,300</strong>
            </div>

        </section>

        <section class="account-actions">

            <button id="reportButton">
                View Financial Report
            </button>

        </section>

    </main>

    <script src="../js/account.js"></script>

</body>

</html>

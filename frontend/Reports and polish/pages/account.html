<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukuru Money Coach - My Account</title>

    <link rel="stylesheet" href="../css/account.css">
</head>

<body>

    <main class="account-container">

        <header class="account-header">
            <h1>My Account</h1>

            <p id="accountSubtitle">Welcome back to your Money Coach.</p>
        </header>


        <section class="account-card">

            <h2>Financial Health</h2>

            <p>Your current credit score</p>

            <div class="credit-score" id="creditScore">
                —
            </div>

            <p class="score-change" id="scoreChange">
                Loading your score…
            </p>

        </section>


        <section class="account-card">

            <h2>My Goal</h2>

            <p id="goalName">—</p>

            <div class="progress-bar">
                <div class="progress" id="goalProgress"></div>
            </div>

            <p id="goalAmount">—</p>

        </section>


        <section class="account-card">

            <h2>Money Overview</h2>

            <div class="money-row">
                <span>Monthly income</span>
                <strong id="monthlyIncome">—</strong>
            </div>

            <div class="money-row">
                <span>Money sent home</span>
                <strong id="sentHome">—</strong>
            </div>

            <div class="money-row">
                <span>Personal expenses</span>
                <strong id="personalExpenses">—</strong>
            </div>

            <div class="money-row">
                <span>Money saved</span>
                <strong id="moneySaved">—</strong>
            </div>

        </section>


        <section class="account-actions">

            <button id="reportButton">
                View Financial Report
            </button>

        </section>


    </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/account.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Coach AI</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Money Coach</h1>
            <p>Your personal financial coach</p>
        </header>

        <main class="chat-messages">
            <div class="message coach-message">
                Hi! I'm your Money Coach. How can I help you today?
            </div>

            <div class="message user-message">
                How can I save more money?
            </div>

        </main>
        <form class="chat-input">
            <input type="text" id="message-input" placeholder="Ask your Money Coach...">
            <button type="submit">Send</button>
    
        </form>

    <script src="script.js"></script>
    </div>
</body>
</html>

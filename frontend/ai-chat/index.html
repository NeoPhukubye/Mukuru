<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukuru Money Coach</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

    <!-- CHAT HEADER -->
    <header class="chat-header">

        <div class="header-brand">
            <span class="brand-title">mukuru</span>

            <div class="coach-title">
                <h1>Money Coach</h1>
                <p>Simple money guidance for you</p>
            </div>
        </div>

        <div class="coach-status">
            <span class="status-dot"></span>
            <span>Online</span>
        </div>

    </header>


    <!-- CHAT MESSAGES -->
    <main class="chat-messages">

        <!-- Initial coach message. Kept as static markup so it paints without
             waiting on script.js; script.js rewrites the name span from
             shared/api-config.js so an overridden user is greeted correctly. -->
        <div class="message coach-message">
            <div class="message-label">Money Coach</div>


            <div class="message-content">
                Hi <span data-user-name>Grace</span>! 👋 I'm your Money Coach. How can I help you with your budget, savings goals, or credit score today?
            </div>


        </div>

    </main>


    <!-- CHAT INPUT -->
    <form class="chat-input">

        <input
            type="text"
            id="message-input"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button type="submit" aria-label="Send message">
            Send
        </button>

    </form>

</div>

<script src="../shared/api-config.js"></script>
<script src="script.js"></script>

</body>
</html>

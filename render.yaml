# Render web service config for Money Coach backend
# Deploy with: `render deploy --dir . --yaml render.yaml`
# See https://render.com/docs/blueprint
#
# REQUIRED: add GEMINI_API_KEY in the Render dashboard (or set it as a secret
# and reference it here). The coach chat falls back to rule-based replies
# when the key is missing, so the demo works offline.

services:
  - type: web
    name: money-coach-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: "sqlite:///./moneycoach.db"
      - key: GEMINI_API_KEY
        # Set your Gemini API key in the Render dashboard.
        # Leave blank to run fully offline with rule-based coach replies.
        value: ""
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: GEMINI_TIMEOUT
        value: "10"
    healthCheckPath: /health
    autoDeploy: true
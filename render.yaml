# Render web service config for Money Coach backend
# Deploy with: `render deploy --dir . --yaml render.yaml`
# See https://render.com/docs/blueprint
#
# REQUIRED: add GEMINI_API_KEY in the Render dashboard (or set it as a secret
# and reference it here). The coach chat falls back to rule-based replies
# when the key is missing, so the demo works offline.

services:
  - type: web
    name: money-coach-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: "sqlite:///./moneycoach.db"
      - key: GEMINI_API_KEY
        # Set the real key in the Render dashboard. `sync: false` keeps this
        # blueprint from overwriting it with a blank value on the next apply.
        sync: false
      - key: GEMINI_MODEL
        # gemini-2.0-flash was retired by Google on 1 June 2026.
        value: "gemini-3.5-flash"
      - key: GEMINI_TIMEOUT
        value: "20"
    healthCheckPath: /health
    autoDeploy: true
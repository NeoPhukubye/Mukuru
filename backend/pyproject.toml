[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez
]
ignore = [
    "B008",  # function calls in defaults are fine for FastAPI Query()
    "UP042", # str + Enum is the idiomatic SQLModel pattern
    "UP045", # Optional[X] is portable across the Python versions this runs on
    "UP017", # datetime.timezone.utc is portable; datetime.UTC is 3.11+
    "DTZ011", # date.today() is the correct idiom for a financial calendar app
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# The keyword table in the categoriser is a single logical unit; wrapping it
# would make the rules harder to read, not easier.
"app/services/categorizer.py" = ["E501"]
# The coach deliberately swallows per-source errors so one failing context
# (e.g. an empty user) never breaks the whole reply.
"app/services/coach.py" = ["SIM105"]
# Test fixtures and throwaway temp files are fine to leave unwrapped.
"tests/*.py" = ["SIM115", "E501"]
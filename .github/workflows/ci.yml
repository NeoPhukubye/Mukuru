name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Smoke-test server startup
        run: |
          (uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/uv.log 2>&1 &) 
          sleep 4
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS "http://127.0.0.1:8765/analyze-budget?user_id=grace" | head -c 200
          echo

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/Render-Platform/render-cli/main/scripts/install.sh | sh
          render deploy --service "$RENDER_SERVICE_ID" --yes